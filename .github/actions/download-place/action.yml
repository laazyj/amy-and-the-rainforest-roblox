# Downloads the `place` artifact of CI's latest successful run, for main or
# for one pull request, into build/place. The Mac jobs play this file and
# never build or check out a pull request's code (docs/MAC_RUNNER.md).
name: Download the place
description: Download CI's place artifact for main or a pull request into build/place.

outputs:
  head-sha:
    description: "The commit the place was built from (a pull request's head commit, for a pull request)."
    value: ${{ steps.download.outputs.head-sha }}

inputs:
  pr:
    description: "A pull request number; empty for main."
    required: false
    default: ""
  token:
    description: "A token with actions: read."
    required: true

runs:
  using: composite
  steps:
    - name: Download the place artifact
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ inputs.pr }}
      run: |
        if [ -z "$PR" ]; then
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          source="main"
        else
          case "$PR" in
          *[!0-9]*) echo "::error::pr must be a pull request number, not '$PR'"; exit 1 ;;
          esac
          # CI's latest successful run for the pull request (a fork's runs
          # carry no pull request, and forks never reach the Mac).
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(any(.pull_requests[]; .number == $PR))][0] | \"\\(.id) \\(.head_sha)\"")
          source="pull request #$PR"
        fi
        run_id=${run%% *}
        head_sha=${run#* }
        if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
          echo "::error::no successful CI run for $source to take the place artifact from"
          exit 1
        fi
        rm -rf build/place
        gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name place --dir build/place
        echo "Place file from CI run $run_id ($source) at $head_sha" >> "$GITHUB_STEP_SUMMARY"
        echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
