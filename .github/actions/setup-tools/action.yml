# Installs the toolchain pinned in rokit.toml, the workflow linters and the
# type definitions by running tools/bootstrap-agent.sh, the same script cloud
# sessions run, so CI and local runs use the same, checksum-verified tools.
# Every workflow that needs the toolchain uses this action.
name: Set up tools
description: Install the toolchain pinned in rokit.toml with tools/bootstrap-agent.sh.

runs:
  using: composite
  steps:
    - name: Cache tool downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/amy-toolchain
          build/globalTypes-*.d.luau
        # The pins, their checksums and the linters' pins.
        key: tools-${{ runner.os }}-${{ hashFiles('rokit.toml', 'tools/toolchain-checksums.txt', 'tools/install-workflow-linters.sh') }}

    - name: Install the pinned tools
      shell: bash
      run: |
        tools/bootstrap-agent.sh "$HOME/.cache/amy-toolchain/bin"
        echo "$HOME/.cache/amy-toolchain/bin" >> "$GITHUB_PATH"
