# Opens or updates one "Baselines" pull request that replaces docs/screens/
# with the captures of a passing Studio playtest of main (brief mac-003,
# Must A3; docs/screens/README.md). The owner accepts the baselines by
# merging it; no job ever pushes them to main. Run by hand from main.
#
# Two jobs, as in upload-assets.yml, so the write token is never in a job
# that runs this repository's tools or reads the playtest's artifact (which
# holds what a pull request's place did in Studio): `collect` checks the
# run and copies its captures with a read-only token; `pull-request` copies
# only PNG files into docs/screens/ and opens the PR.
name: Baselines

on:
  workflow_dispatch:
    inputs:
      run:
        description: "The id of a passing Studio playtest run of main (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: baselines
  cancel-in-progress: false

jobs:
  collect:
    name: Take the captures of a passing playtest of main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # find the playtest run and download its artifact
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: $/.github/actions/setup-tools

      # A run of main is named "Studio playtest of main" by studio-playtest.yml's
      # run-name (tests/lune/tools/screens.spec.luau holds the two together).
      - name: Find the run and download its screenshots
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: |
          case "$RUN" in
          "")
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow studio-playtest.yml --branch main \
              --status success --limit 50 --json databaseId,displayTitle \
              --jq '[.[] | select(.displayTitle == "Studio playtest of main")][0].databaseId // empty')
            if [ -z "$RUN" ]; then
              echo "::error::no passing Studio playtest of main in the last 50 runs"
              exit 1
            fi
            ;;
          *[!0-9]*) echo "::error::run must be a run id"; exit 1 ;;
          *)
            seen=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,displayTitle,conclusion \
              --jq '[.workflowName, .headBranch, .displayTitle, .conclusion] | join(" / ")')
            if [ "$seen" != "Studio playtest / main / Studio playtest of main / success" ]; then
              echo "::error::run $RUN is not a passing Studio playtest of main: $seen"
              exit 1
            fi
            ;;
          esac
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name studio-playtest --dir "$RUNNER_TEMP/playtest"
          echo "id=$RUN" >> "$GITHUB_OUTPUT"

      - name: Copy its captures as the baselines
        run: lune run tools/screens baselines --artifact "$RUNNER_TEMP/playtest" --out "$RUNNER_TEMP/baselines/screens"

      - name: Write the PR body
        env:
          RUN: ${{ steps.run.outputs.id }}
        run: |
          {
            echo "Baselines from [Studio playtest run $RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN), a passing run of main on every device."
            echo
            echo "Merging accepts them: from then on every playtest compares its captures with these (docs/screens/README.md)."
            echo "The Files changed tab shows each changed image before and after (2-up, swipe, onion skin); a new capture is an added file, a capture the playthrough no longer takes a deleted one."
          } > "$RUNNER_TEMP/baselines/pr-body.md"
          cat "$RUNNER_TEMP/baselines/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the baselines and the PR body
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines
          path: ${{ runner.temp }}/baselines/
          if-no-files-found: error
          retention-days: 7

  pull-request:
    name: Open or update the Baselines PR
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the baselines branch
      pull-requests: write # open or update the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the baselines and the PR body
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: baselines
          path: ${{ runner.temp }}/baselines

      # Only <device>/<file>.png comes in; README.md stays.
      - name: Replace the baselines in docs/screens
        run: |
          find docs/screens -name '*.png' -delete
          cd "$RUNNER_TEMP/baselines/screens"
          find . -mindepth 2 -maxdepth 2 -type f -name '*.png' | while read -r file; do
            mkdir -p "$GITHUB_WORKSPACE/docs/screens/$(dirname "$file")"
            cp "$file" "$GITHUB_WORKSPACE/docs/screens/$file"
          done

      # A PR opened with the job token does not trigger CI, so the
      # TOOLCHAIN_PR_TOKEN secret (a fine-grained token, see
      # docs/MAINTENANCE.md) is used when it exists.
      - name: Open or update the PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TOOLCHAIN_PR_TOKEN || github.token }}
          branch: baselines
          title: Baselines
          commit-message: Baselines from a Studio playtest of main
          body-path: ${{ runner.temp }}/baselines/pr-body.md
          add-paths: docs/screens
          delete-branch: true
