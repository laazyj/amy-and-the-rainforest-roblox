name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: ./.github/actions/setup-tools

      - name: Static checks
        run: tools/check.sh

      - name: Unit tests
        run: tools/test.sh

      - name: Build
        run: tools/build.sh

      - name: Upload place file
        uses: actions/upload-artifact@v7
        with:
          name: place
          path: build/AmyAndTheRainforest.rbxl
          if-no-files-found: error
