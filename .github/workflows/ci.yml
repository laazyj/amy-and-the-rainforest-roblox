name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: ./.github/actions/setup-tools

      - name: Static checks
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (impostor commits, known-vulnerable actions)
        run: tools/check.sh

      - name: Unit tests
        run: tools/test.sh

      - name: Build
        run: tools/build.sh

      - name: Upload place file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: place
          path: build/AmyAndTheRainforest.rbxl
          if-no-files-found: error

      # A stale roblox.yml only means Selene lacks Roblox's newest globals, so
      # it warns rather than failing the PR; the weekly toolchain job
      # regenerates it and fails hard if it cannot.
      - name: Check roblox.yml against a freshly generated one
        id: roblox-std
        if: ${{ !cancelled() }}
        run: |
          if ! tools/roblox-std.sh check; then
            echo "::warning file=roblox.yml,title=Selene's Roblox standard library is stale::See this step's log; the roblox-std artifact holds a fresh roblox.yml."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the generated roblox.yml
        if: steps.roblox-std.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roblox-std
          path: build/roblox-std/roblox.yml
          if-no-files-found: error
