name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: ./.github/actions/setup-tools

      - name: Static checks
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (impostor commits, known-vulnerable actions)
        run: tools/check.sh

      - name: Unit tests
        run: tools/test.sh

      - name: Build
        run: tools/build.sh

      - name: Upload place file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: place
          path: build/AmyAndTheRainforest.rbxl
          if-no-files-found: error

      # tools/check.sh lints with the committed roblox.yml (cloud sessions
      # cannot generate it: Selene's HTTP client rejects their proxy). Here,
      # where Selene can reach the API dump, it must match a fresh one.
      - name: Check roblox.yml against a freshly generated one
        id: roblox-std
        run: |
          mkdir -p "$RUNNER_TEMP/roblox-std"
          (cd "$RUNNER_TEMP/roblox-std" && selene generate-roblox-std)
          if ! cmp -s roblox.yml "$RUNNER_TEMP/roblox-std/roblox.yml"; then
            echo "::error file=roblox.yml,title=Selene's Roblox standard library is out of date::roblox.yml differs from what 'selene generate-roblox-std' generates now. Merge the open Toolchain updates PR, or commit the roblox-std artifact of this run as roblox.yml."
            diff -u roblox.yml "$RUNNER_TEMP/roblox-std/roblox.yml" | head -n 100 || true
            exit 1
          fi

      - name: Upload the generated roblox.yml
        if: failure() && steps.roblox-std.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roblox-std
          path: ${{ runner.temp }}/roblox-std/roblox.yml
          if-no-files-found: error
