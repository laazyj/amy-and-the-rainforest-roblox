# Tier 2: build the place, publish it to Dev as a Saved version (not visible
# to players), then run tests/engine/ against that exact version through Open
# Cloud Luau Execution, then delete what the run left in its test stores
# (test-<RUN_ID>-*) through the Open Cloud DataStore API and list them
# again to show they are empty. See docs/OPEN_CLOUD.md.
#
# The workflow runs on every pull request, so the job can be a required
# status check (a path-filtered workflow that never runs would leave the
# check "Expected" forever). The gate skips the test job, which then reports
# as skipped and satisfies the check, for a docs-only PR (every changed file
# is under docs/ or is a .md file) and when ROBLOX_DEV_API_KEY is missing
# (before setup, or on a PR from a fork, which gets no secrets), with a
# notice instead of a failure.
name: Engine tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: engine-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A job-level `if:` cannot read secrets or the changed files, so a tiny
  # job decides whether the test job runs.
  gate:
    name: Check for the Dev key and a code change
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # File names stay in a variable and a pipe, never in a command line.
      - id: gate
        env:
          HAS_KEY: ${{ secrets.ROBLOX_DEV_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          skip() {
            echo "::notice title=Engine tests skipped, $1::$2 Nothing was published or run."
            echo "Engine tests skipped, $1: $2 Nothing was published or run." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          }
          if [ "$HAS_KEY" != "true" ]; then
            skip "no key" "ROBLOX_DEV_API_KEY is not available to this run (not set up yet, or a PR from a fork)."
            exit 0
          fi
          # Docs only: every changed file is under docs/ or is a .md file.
          # An empty list is not docs only. A failed API call fails the step.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          other=$(printf '%s\n' "$files" | grep -c -v -E '^(docs/|$)|\.md$' || true)
          if [ -n "$files" ] && [ "$other" -eq 0 ]; then
            skip "docs only" "every file this PR changes is under docs/ or is a .md file."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  engine-tests:
    name: Publish a Saved version and run the engine tests
    needs: gate
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      DEV_UNIVERSE_ID: ${{ vars.DEV_UNIVERSE_ID }}
      DEV_PLACE_ID: ${{ vars.DEV_PLACE_ID }}
      RELEASE_UNIVERSE_ID: ${{ vars.RELEASE_UNIVERSE_ID }}
      RELEASE_PLACE_ID: ${{ vars.RELEASE_PLACE_ID }}
      # names this run's test stores, test-<RUN_ID>-*
      RUN_ID: pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: $/.github/actions/setup-tools

      - name: Build the place
        run: tools/build.sh

      - name: Publish to Dev as a Saved version
        id: publish
        env:
          ROBLOX_DEV_API_KEY: ${{ secrets.ROBLOX_DEV_API_KEY }}
        run: |
          version=$(lune run tools/publish --universe "$DEV_UNIVERSE_ID" --place "$DEV_PLACE_ID" \
            --file build/AmyAndTheRainforest.rbxl --version-type Saved)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Saved Dev version $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Run engine tests against that version
        env:
          ROBLOX_DEV_API_KEY: ${{ secrets.ROBLOX_DEV_API_KEY }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          lune run tools/run-engine-tests --universe "$DEV_UNIVERSE_ID" --place "$DEV_PLACE_ID" \
            --version "$VERSION" --dir tests/engine --run-id "$RUN_ID"

      # Runs whether the tests passed or not, once any task may have run.
      - name: Delete the run's test-store entries and list the stores again
        if: always() && steps.publish.outcome == 'success'
        env:
          ROBLOX_DEV_API_KEY: ${{ secrets.ROBLOX_DEV_API_KEY }}
        run: |
          set -o pipefail
          lune run tools/clean-test-stores --universe "$DEV_UNIVERSE_ID" --place "$DEV_PLACE_ID" \
            --run-id "$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
