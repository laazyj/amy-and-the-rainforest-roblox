# Nightly mutation check (plan section 4, brief 008): tools/mutate.luau
# applies a dozen canned faults one at a time to a copy of the repository
# and runs tier 1 against each. The job fails if any fault leaves the suite
# green, or no longer applies. The job summary names the tests that caught
# each fault. Run it by hand from the Actions tab (workflow_dispatch).
name: Mutation check

on:
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutation:
    name: Every canned fault fails tier 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: $/.github/actions/setup-tools

      # The report (stdout) goes to the job summary. An explicit
      # `shell: bash` runs with `-eo pipefail`, so the step fails when the
      # tool does; the default shell (`bash -e`) would keep tee's status.
      - name: Run the mutation check
        shell: bash
        run: lune run tools/mutate | tee -a "$GITHUB_STEP_SUMMARY"
