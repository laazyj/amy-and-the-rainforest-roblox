# Publishes main to the Dev experience as a Published version, so the latest
# merge is what you play on Dev. Runs after CI succeeds on a push to main and
# publishes the commit CI tested; a manual run is accepted from main only.
# Never touches Release: that will be release.yml, behind the gated
# `release` environment. See docs/OPEN_CLOUD.md.
#
# Inert until ROBLOX_DEV_API_KEY exists: without it the job skips with a notice.
name: Publish to Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  # A job-level `if:` cannot read secrets, so a tiny job checks for the key.
  gate:
    name: Check for the Dev key
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only a successful CI run for a push to this repository counts
    # (`branches: [main]` alone would also match a fork's branch named main).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          HAS_KEY: ${{ secrets.ROBLOX_DEV_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Publish skipped, no key::ROBLOX_DEV_API_KEY is not set up yet. Nothing was published."
            echo "Publish skipped, no key: ROBLOX_DEV_API_KEY is not set up yet. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  publish-dev:
    name: Publish to Dev
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      DEV_UNIVERSE_ID: ${{ vars.DEV_UNIVERSE_ID }}
      DEV_PLACE_ID: ${{ vars.DEV_PLACE_ID }}
      RELEASE_UNIVERSE_ID: ${{ vars.RELEASE_UNIVERSE_ID }}
      RELEASE_PLACE_ID: ${{ vars.RELEASE_PLACE_ID }}
      # The commit CI tested; on a manual run, main's head.
      PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PUBLISH_SHA }}

      - name: Install the pinned toolchain
        uses: ./.github/actions/setup-tools

      - name: Build the place
        run: tools/build.sh

      - name: Publish to Dev
        env:
          ROBLOX_DEV_API_KEY: ${{ secrets.ROBLOX_DEV_API_KEY }}
        run: |
          version=$(lune run tools/publish --universe "$DEV_UNIVERSE_ID" --place "$DEV_PLACE_ID" \
            --file build/AmyAndTheRainforest.rbxl --version-type Published)
          echo "Published Dev version $version from $PUBLISH_SHA" >> "$GITHUB_STEP_SUMMARY"
