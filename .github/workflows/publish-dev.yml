# Publishes main to the Dev experience (manual runs too: only from main) as a Published version, so the latest
# merge is what you play on Dev. Never touches Release: that is release.yml,
# behind the gated `release` environment. See docs/OPEN_CLOUD.md.
#
# Inert until ROBLOX_DEV_API_KEY exists: without it the job skips with a notice.
#
# The Rokit and Rojo steps duplicate ci.yml (brief 001); share them once both exist.
name: Publish to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  # A job-level `if:` cannot read secrets, so a tiny job checks for the key.
  gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          HAS_KEY: ${{ secrets.ROBLOX_DEV_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Publish skipped, no key::ROBLOX_DEV_API_KEY is not set up yet. Nothing was published."
            echo "Publish skipped, no key: ROBLOX_DEV_API_KEY is not set up yet. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  publish-dev:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEV_UNIVERSE_ID: ${{ vars.DEV_UNIVERSE_ID }}
      DEV_PLACE_ID: ${{ vars.DEV_PLACE_ID }}
      RELEASE_UNIVERSE_ID: ${{ vars.RELEASE_UNIVERSE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit and the pinned tools
        run: |
          test -f rokit.toml || { echo "::error::rokit.toml is missing; brief 001 provides it."; exit 1; }
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check
        env:
          GITHUB_PAT: ${{ github.token }}

      - name: Build the place
        run: rojo build default.project.json -o build/AmyAndTheRainforest.rbxl

      - name: Publish to Dev
        env:
          ROBLOX_DEV_API_KEY: ${{ secrets.ROBLOX_DEV_API_KEY }}
        run: |
          version=$(lune run tools/publish --universe "$DEV_UNIVERSE_ID" --place "$DEV_PLACE_ID" \
            --file build/AmyAndTheRainforest.rbxl --version-type Published)
          echo "Published Dev version $version from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
