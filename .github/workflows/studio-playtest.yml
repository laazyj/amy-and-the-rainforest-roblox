# Tier 3 playthrough on the Mac (brief mac-002): on the self-hosted runner
# inside the Mac's virtual machine, play a CI-built place in Roblox Studio
# from a fresh Save to the end card, once per device (PC, and a phone and a
# tablet preset in both orientations), with a screenshot at every Shot,
# Chapter card and Scene entry (tools/studio-playtest/play.luau). Uploads the
# screenshots and report.json, which holds the Studio version against the one
# the bridge was proven on. See docs/MAC_RUNNER.md.
#
# Started by hand, or for a pull request by its `needs-playtest` label
# through playtest-label.yml, which runs on GitHub's runners and dispatches
# this workflow on main with the pull request's number. So the Mac only ever
# runs this file as it is on main, as the rules for every Mac job require
# (docs/MAC_RUNNER.md): the tools come from main, the place is CI's artifact,
# read-only permissions, no secrets, a timeout and one Studio at a time.
#
# Then, on GitHub's runners (brief mac-003; docs/MAC_RUNNER.md, "Screenshots
# on a pull request"): `sheets`, read-only, makes a contact sheet per device
# and compares every capture with its baseline in docs/screens/
# (tools/screens.luau); `publish`, the only job with a write token, runs
# nothing from the artifact and of this repository only main's post-comment
# action: it force-pushes
# the images to playtest/pr-<N> (playtest/main for a run of main) as one
# commit and posts or updates the one comment on pull request N, or writes
# the job summary for a run of main.
name: Studio playtest
run-name: Studio playtest of ${{ inputs.pr && format('#{0}', inputs.pr) || 'main' }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number whose CI-built place to play (empty: the latest built from main)"
        required: false
        default: ""
      devices:
        description: "Devices, comma-separated, as named in Playthrough.DEVICES (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

# One Studio, one screen.
concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  playtest:
    name: Play the Story in Studio on the Mac
    runs-on: [self-hosted, studio]
    # Only main may deploy to this environment (docs/MAC_RUNNER.md).
    environment: studio
    permissions:
      contents: read
      actions: read # to find and download CI's place artifact
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    # A playtest of a pull request reports; it never fails the pull request
    # (plan section 4: tier 3 is not on a PR's critical path).
    continue-on-error: ${{ inputs.pr != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the tools from main, whatever ref the run was started on
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: $/.github/actions/setup-tools

      - name: Download the place artifact
        uses: $/.github/actions/download-place
        with:
          pr: ${{ inputs.pr }}
          token: ${{ github.token }}

      - name: Play it in Studio
        env:
          DEVICES: ${{ inputs.devices }}
        run: |
          case "$DEVICES" in
          *[!a-z,-]*) echo "::error::devices must be device names separated by commas"; exit 1 ;;
          esac
          rm -rf build/studio-playtest # the runner keeps its work directory between jobs
          lune run tools/studio-playtest/play --file build/place/AmyAndTheRainforest.rbxl \
            --out build/studio-playtest ${DEVICES:+--devices "$DEVICES"}

      - name: Add the results to the summary
        if: always()
        run: lune run tools/studio-playtest/summary build/studio-playtest/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots and the report
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-playtest
          path: build/studio-playtest
          if-no-files-found: error

  # The artifact holds what a pull request's place did in Studio, so it is
  # read here, with a read-only token, and nowhere near the write token.
  sheets:
    name: Make the contact sheets and compare with the baselines
    needs: playtest
    # Whenever the Mac job uploaded its artifact, whatever the playtest's result.
    if: ${{ always() && needs.playtest.outputs.artifact-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.sheets.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the tools and the baselines from main
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: $/.github/actions/setup-tools

      - name: Download the screenshots and the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-playtest
          path: ${{ runner.temp }}/playtest

      # The branch is named here once; publish pushes to it and the
      # comment's images link into it.
      - name: Make the contact sheets, the differences and the comment
        id: sheets
        env:
          PR: ${{ inputs.pr }}
          ARTIFACT_URL: ${{ needs.playtest.outputs.artifact-url }}
        run: |
          case "$PR" in
          "") branch=playtest/main ;;
          *[!0-9]*) echo "::error::pr must be a pull request number"; exit 1 ;;
          *) branch="playtest/pr-$PR" ;;
          esac
          lune run tools/screens sheets --artifact "$RUNNER_TEMP/playtest" --baselines docs/screens \
            --files "$RUNNER_TEMP/screens/files/run-$GITHUB_RUN_ID" --comment "$RUNNER_TEMP/screens/comment.md" \
            --base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$branch/run-$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --artifact-url "$ARTIFACT_URL"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Upload the images and the comment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-playtest-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Put the screenshots on the pull request
    needs: sheets
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-push playtest/pr-<N> or playtest/main
      pull-requests: write # the one comment on pull request N
    timeout-minutes: 10
    steps:
      # Only for the post-comment action, from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download the images and the comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-playtest-screens
          path: ${{ runner.temp }}/screens

      # One commit with no parent, force-pushed, so the branch never grows.
      # The token goes in a header, never in a remote URL.
      - name: Push the images to the playtest branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.sheets.outputs.branch }}
        run: |
          case "$BRANCH" in
          playtest/main | playtest/pr-[0-9]*) ;;
          *) echo "::error::not a playtest branch: $BRANCH"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP/screens/files"
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "Screenshots of Studio playtest run $GITHUB_RUN_ID"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q --force \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

      - name: Post or update the comment on the pull request
        if: inputs.pr != ''
        uses: $/.github/actions/post-comment
        with:
          pr: ${{ inputs.pr }}
          body-file: ${{ runner.temp }}/screens/comment.md
          token: ${{ github.token }}

      - name: Write the screenshots to the summary of a run of main
        if: inputs.pr == ''
        run: cat "$RUNNER_TEMP/screens/comment.md" >> "$GITHUB_STEP_SUMMARY"
