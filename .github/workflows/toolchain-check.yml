# Weekly: compares each pin in rokit.toml (and any Wally dependency) with the
# latest release, regenerates Selene's Roblox standard library (roblox.yml),
# and opens or updates one "Toolchain updates" PR with the new pins, their
# checksums and roblox.yml, so CI runs the full check, test and build against
# them. Nothing merges automatically. Dependabot covers the `uses:` lines (dependabot.yml).
# See docs/MAINTENANCE.md.
#
# Two jobs, so no write token is ever in a job that runs fetched tools: `check`
# installs the toolchain and computes the new pins with a read-only token;
# `pull-request` runs no fetched tools, applies the patch and opens the PR.
name: Toolchain check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-check
  cancel-in-progress: false

jobs:
  check:
    name: Compare the pins with the latest releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: ./.github/actions/setup-tools

      - name: Compare the pins and write the patch
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"
          lune run tools/toolchain-check > "$RUNNER_TEMP/toolchain/pr-body.md"
          # Regenerate roblox.yml with the Selene that will lint with it: when
          # the pins moved, install them (checked against their new checksums)
          # outside the cached tool directory.
          selene=selene
          if ! git diff --quiet rokit.toml; then
            tools/bootstrap-agent.sh "$RUNNER_TEMP/new-tools"
            selene="$RUNNER_TEMP/new-tools/selene"
          fi
          "$selene" generate-roblox-std # rewrites roblox.yml from Roblox's current API dump
          if ! git diff --quiet roblox.yml; then
            printf '\n\n%s\n' "Selene's Roblox standard library (\`roblox.yml\`) is regenerated from Roblox's current API dump." >> "$RUNNER_TEMP/toolchain/pr-body.md"
          fi
          git diff --binary > "$RUNNER_TEMP/toolchain/pins.patch"
          if [ -s "$RUNNER_TEMP/toolchain/pins.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch and the PR body
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-updates
          path: ${{ runner.temp }}/toolchain/
          if-no-files-found: error
          retention-days: 7

  pull-request:
    name: Open or update the Toolchain updates PR
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the toolchain-updates branch
      pull-requests: write # open or update the PR
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the patch and the PR body
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-updates
          path: ${{ runner.temp }}/toolchain

      # The patch came from a job that ran fetched tools, so it is applied to
      # the pin files only; add-paths below limits the commit the same way.
      - name: Apply the new pins
        run: >-
          git apply --include=rokit.toml --include=wally.toml --include=.luaurc
          --include=tools/toolchain-checksums.txt --include=roblox.yml
          "$RUNNER_TEMP/toolchain/pins.patch"

      # A PR opened with the job token does not trigger CI, so the
      # TOOLCHAIN_PR_TOKEN secret (a fine-grained token, see
      # docs/MAINTENANCE.md) is used when it exists.
      - name: Open or update the PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TOOLCHAIN_PR_TOKEN || github.token }}
          branch: toolchain-updates
          title: Toolchain updates
          commit-message: Update the toolchain pins
          body-path: ${{ runner.temp }}/toolchain/pr-body.md
          labels: dependencies
          add-paths: |
            rokit.toml
            wally.toml
            .luaurc
            tools/toolchain-checksums.txt
            roblox.yml
          delete-branch: true
