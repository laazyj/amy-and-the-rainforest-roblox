# Findings accepted rather than fixed, each with its reason. zizmor runs with
# the pedantic persona in tools/check.sh and CI; nothing is suppressed inline.
rules:
  # Dev publishes must wait for CI (brief 005, item 5). The gate job runs only
  # for a successful CI run of a push in this repository, and checks out that
  # run's head_sha: a reviewed commit on main, never fork code.
  dangerous-triggers:
    ignore:
      - publish-dev.yml

  # A fixed path (build/bin in the checkout); nothing attacker-controlled is written,
  # and a composite action has no other way to put tools on PATH.
  github-env:
    ignore:
      - action.yml

  # The suggested `uses: $/.github/actions/setup-tools` is rejected by
  # actionlint 1.7.12; `./` refers to the same checked-out commit.
  self-repository:
    ignore:
      - ci.yml
      - engine-tests.yml
      - mutation.yml
      - publish-dev.yml
      - studio-playtest.yml
      - studio-smoke.yml
      - test-change.yml
      - toolchain-check.yml
      - upload-assets.yml

  # Named by the brief; replacing it with gh calls means hand-rolled push and
  # PR-update logic holding a write token. SHA-pinned, kept current by Dependabot.
  # upload-assets.yml opens its id PR the same way.
  superfluous-actions:
    ignore:
      - toolchain-check.yml
      - upload-assets.yml

  # Shown only by `--persona=auditor`; listed so nothing is hidden.
  # publish-dev.yml and upload-assets.yml read the Dev key from the `dev`
  # environment. engine-tests.yml runs on PR branches by design, so it reads
  # the repository secret (docs/MAINTENANCE.md); toolchain-check.yml reads
  # the PR token. Each key is passed only to the steps that need it.
  secrets-outside-env:
    ignore:
      - engine-tests.yml
      - toolchain-check.yml
