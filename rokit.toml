# Toolchain pins. tools/bootstrap-agent.sh (which CI runs) installs them from
# the release zips checksummed in tools/toolchain-checksums.txt; change a pin
# and its checksum lines together. Rokit (`rokit install`) reads them too.

[tools]
rojo = "rojo-rbx/rojo@7.7.1"
lune = "lune-org/lune@0.10.5"
wally = "UpliftGames/wally@0.3.2"
stylua = "JohnnyMorganz/StyLua@2.5.2"
selene = "Kampfkarren/selene@0.32.0"
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"
