std = "roblox"
# Use the committed roblox.yml (kept current by CI and the weekly toolchain
# job, see docs/MAINTENANCE.md), never a copy Selene downloads and caches.
roblox-std-source = "pinned"
# tests/engine has its own config (tests/engine/selene.toml).
exclude = ["tests/engine/*"]

[lints]
# Style-only suggestion (UDim2.new -> UDim2.fromScale / fromOffset) that fires
# 14 times in the existing UI code. Allowed rather than rewritten so the
# toolchain change leaves game code untouched; revisit in Checkpoint B.
roblox_manual_fromscale_or_fromoffset = "allow"
