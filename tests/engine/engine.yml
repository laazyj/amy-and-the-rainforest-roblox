# Selene standard library for engine test scripts (tests/engine/ only).
# Each script runs inside a task built by EngineTests.wrap in
# tools/lib/engine-tests.luau, which defines these names before the script:
# RUN_ID and PASS_MARKER as globals, and the prelude's exports
# (EngineTests.PRELUDE_EXPORTS) as locals, except `game`, which Roblox's std
# already declares. A unit test (tests/lune/tools/prelude.test.luau) checks
# this list against PRELUDE_EXPORTS.
---
name: engine-tests
globals:
  RUN_ID:
    property: read-only
  PASS_MARKER:
    property: read-only
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  storeName:
    args:
      - type: string
  finish:
    args: []
