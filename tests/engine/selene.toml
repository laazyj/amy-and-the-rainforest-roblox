# Engine test scripts are linted on their own (see tools/check.sh): they see
# the names the runner injects, declared in engine.yml, on top of Roblox's.
std = "roblox+engine"
# Selene reads roblox.yml from the working directory: run from the repository
# root with --config (tools/check.sh does), not from this directory.
roblox-std-source = "pinned"
# Type declarations for luau-lsp, not code.
exclude = ["*.d.luau"]
